[package]
name = "oxihist"
version = "0.18.0"
edition = "2024"
rust-version = "1.100"
license = "MIT"
repository = "https://github.com/oxihep/oxihist"
documentation = "https://docs.rs/oxihist"
readme = "README.md"
keywords = ["histogram", "boost-histogram", "hep", "physics", "statistics"]
categories = ["science", "data-structures", "mathematics"]
description = "Pure-Rust histograms for high-energy physics, modelled on boost-histogram and scikit-hep hist: typed axes, weighted and profile storages, projections, rebinning, multithreaded fills"

[dependencies]
rayon = { version = "1", optional = true }
# Per-thread storage without a shared lock, for ThreadedHist.
thread_local = "1.1"
serde = { version = "1", features = ["derive"], optional = true }
# Until these are on crates.io they are git dependencies on release tags;
# `version` is kept so the switch is just dropping `git`/`tag`. They must name
# the same tags oxiroot does, so one copy of each is built.
oxiplot = { git = "https://github.com/oxihep/oxiplot", tag = "v0.14.0", version = "0.14.0", default-features = false, optional = true }
oxifit = { git = "https://github.com/oxihep/oxifit", tag = "v0.11.0", version = "0.11.0", optional = true }
foldhash = "0.2"
# The chi-square and Kolmogorov probabilities behind `chi2_test` and
# `kolmogorov_test`; the tag oxifit and oxiroot name, so one copy is built.
oxistats = { git = "https://github.com/oxihep/oxistats", tag = "v0.2.1", version = "0.2.1" }

[dev-dependencies]
proptest = "1"
# `float_roundtrip`: the serde tests compare sums after a round trip, which
# serde_json's default float parser can change in the last bit.
serde_json = { version = "1", features = ["float_roundtrip"] }
oxiplot = { git = "https://github.com/oxihep/oxiplot", tag = "v0.14.0", version = "0.14.0", default-features = false }

[features]
# Parallel fill from a slice (`fill_par`).
rayon = ["dep:rayon"]
# Serialize histograms, axes and bins.
serde = ["dep:serde"]
# Implement oxiplot's data traits, so `Axes::hist(&h)` draws a histogram.
plot = ["dep:oxiplot"]
# Implement oxifit's `FitData`, so `h.fit(&model)` fits a 1-D histogram.
fit = ["dep:oxifit"]

[package.metadata.docs.rs]
all-features = true

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
all = "warn"
# Casts that can lose information: fixed (`From`, `try_from`) or justified
# where they stand. `cast_precision_loss` stays off: the integer → f64 casts
# are counts and bin indices, exact below 2⁵³.
cast_possible_truncation = "warn"
cast_sign_loss = "warn"
cast_possible_wrap = "warn"
cast_lossless = "warn"
